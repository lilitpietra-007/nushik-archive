name: Deploy the needlework archive

# The site is committed already built, so there is nothing to compile here -
# this only hands dist to GitHub Pages. It runs on every push
# that touches the archive, and can be run by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# let a running deploy finish rather than cancelling it half-published
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      # enablement turns Pages on via the API the first time this runs, so the
      # repository does not have to be configured by hand beforehand
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
